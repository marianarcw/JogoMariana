<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual a Cor?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Qual a Cor?</h1>
        <p>Clique na caixa de cor que corresponde ao nome:</p>
        <h2 id="color-name"></h2>
        <div class="color-options">
            <div class="color-box" data-color="red"></div>
            <div class="color-box" data-color="blue"></div>
            <div class="color-box" data-color="green"></div>
            <div class="color-box" data-color="yellow"></div>
        </div>
        <p id="message"></p>
        <button id="restart-btn">Reiniciar</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
